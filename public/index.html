<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Window</title>
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <style>
        #no-context-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(6px);
            background-color: rgba(255, 255, 255, 0.5);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 2px #fff;
          }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        #top-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #2d7ef7; /* Match the blue background of the all-notes sidebar */
            color: white;
            border-bottom-left-radius: 12px;
            border-bottom-left-radius: 12px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            gap: 8px; /* Add spacing between buttons */
            background: #2d7ef7; /* Match the sidebar header background */
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            margin: auto;
        }

        #lock-button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #2d7ef7;
            background: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
            text-align: center;
            width: 80%; /* Ensure the button stays centered */
        }

        #lock-button:hover {
            background: rgba(255, 255, 255, 0.8);
            color: #1a5bbf;
        }

        #always-on-top-button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #2d7ef7;
            background: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }

        #refresh-button:hover,
        #always-on-top-button:hover {
            background: rgba(255, 255, 255, 0.8);
            color: #1a5bbf;
        }

        #quill-editor {
            flex: 1;
            background: white;
            border-radius: 0 0 12px 12px;
            overflow-y: auto;
            box-shadow: inset 0px 4px 8px rgba(0, 0, 0, 0.1);
            color: black;
        }

        .ql-toolbar {
            border-radius: 0; /* Remove rounded edges */
            background: #f4f4f4;
        }

        .ql-container {
            border-radius: 0 0 12px 12px;
        }
    </style>
</head>
<body>
    <div id="top-container">
        <div class="buttons">
            <button id="lock-button">Lock</button>
            <button id="always-on-top-button">Always on Top: On</button>
        </div>
        <div id="quill-editor"></div>
    </div>
    <script src="../src/renderer.js"></script>
    <div id="no-context-overlay">
  Choose a context
</div>
</body>
</html>
